# ============================================================
# XMESH Configuration – Expert Edition
# ============================================================

mqtt:
  broker: "mqtt.meshtastic.org"
  # 1883 = plain MQTT | 8883 = TLS
  port: 1883
  username: "meshdev"
  password: "large4cats"
  use_tls: false

  # Multi-channel / multi-region subscription
  # Each entry is subscribed. Use wildcards freely.
  topics:
    - "msh/+/2/c/LongFast/#"
    # - "msh/EU_868/2/c/LongFast/#"
    # - "msh/US/2/c/LongFast/#"
    # - "msh/+/2/e/LongFast/#"   # encrypted variant

mesh:
  # Primary channel key (Base64). "AQ==" = public default LongFast.
  # For private channels put your 16-byte PSK here.
  channel_key_base64: "AQ=="

  # Optional extra keys to try when decrypting (multi-PSK)
  # extra_keys_base64:
  #   - "YourOtherKeyBase64=="
