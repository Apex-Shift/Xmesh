[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmesh"
version = "2.0.0"
description = "Expert-grade Meshtastic MQTT monitor with tactical dark UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xmesh Contributors" }]
keywords = ["meshtastic", "mqtt", "lora", "mesh", "pyside6"]
dependencies = [
    "paho-mqtt>=1.6.1,<3.0",
    "PyYAML>=6.0",
    "protobuf>=4.21.0",
    "cryptography>=41.0.0",
    "PySide6>=6.5.0",
    "meshtastic>=2.3.0",
]

[project.scripts]
xmesh = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "models*", "ui*"]
